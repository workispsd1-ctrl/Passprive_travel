<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PassPrivé Travel — Mobile Preview Simulator</title>
  <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Plus Jakarta Sans", sans-serif;
      overflow-x: hidden;
    }
    /* Device Frame Lighting & Material */
    .titanium-frame {
      background: linear-gradient(135deg, #2B2A2E 0%, #19181B 45%, #252428 100%);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.12) inset,
        0 0 0 4px #0C0B0D,
        0 24px 64px -12px rgba(0, 0, 0, 0.65),
        0 12px 28px -8px rgba(0, 0, 0, 0.45);
      border-radius: 52px;
      padding: 12px;
      position: relative;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .screen-container {
      border-radius: 42px;
      overflow: hidden;
      background: #2D1E18;
      position: relative;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.8) inset;
    }
    /* Dynamic Island */
    .dynamic-island {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 32px;
      background: #000;
      border-radius: 20px;
      z-index: 50;
      pointer-events: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
    }
    /* Side Buttons on Chassis */
    .btn-silent {
      position: absolute;
      left: -6px;
      top: 115px;
      width: 4px;
      height: 28px;
      background: #3A393E;
      border-radius: 2px 0 0 2px;
    }
    .btn-vol-up {
      position: absolute;
      left: -6px;
      top: 160px;
      width: 4px;
      height: 52px;
      background: #3A393E;
      border-radius: 2px 0 0 2px;
    }
    .btn-vol-down {
      position: absolute;
      left: -6px;
      top: 225px;
      width: 4px;
      height: 52px;
      background: #3A393E;
      border-radius: 2px 0 0 2px;
    }
    .btn-power {
      position: absolute;
      right: -6px;
      top: 175px;
      width: 4px;
      height: 76px;
      background: #3A393E;
      border-radius: 0 2px 2px 0;
    }
    /* Home Indicator */
    .home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 135px;
      height: 4.5px;
      background: rgba(255, 255, 255, 0.45);
      border-radius: 10px;
      z-index: 50;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }
    /* Custom Scrollbar inside iframe */
    iframe::-webkit-scrollbar {
      width: 4px;
    }
    iframe::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }
  </style>
</head>
<body id="previewBody" class="bg-[#15110E] text-neutral-100 min-h-screen flex flex-col transition-colors duration-300">

  <!-- Top Studio Control Bar -->
  <header class="w-full bg-[#1C1713]/90 backdrop-blur-xl border-b border-white/10 px-4 sm:px-8 py-3.5 sticky top-0 z-50 flex flex-wrap items-center justify-between gap-4">
    <!-- Brand & Status -->
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-[#E05A47] to-[#F59E0B] flex items-center justify-center font-black text-white text-base shadow-md shadow-[#E05A47]/30">
        P
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="font-extrabold text-sm sm:text-base tracking-tight text-white">PassPrivé Travel</span>
          <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-orange-500/20 text-orange-300 border border-orange-400/30">Mobile Simulator</span>
        </div>
        <p class="text-xs text-neutral-400">Live preview of responsive mobile experience</p>
      </div>
    </div>

    <!-- Controls: Device Preset, Scale, Actions -->
    <div class="flex flex-wrap items-center gap-2 sm:gap-3 text-xs">
      
      <!-- Device Selector -->
      <div class="flex items-center gap-1.5 bg-white/5 border border-white/10 rounded-xl px-2.5 py-1.5">
        <svg class="w-3.5 h-3.5 text-neutral-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
        <label for="deviceSelect" class="text-neutral-400 text-[11px] font-medium hidden sm:inline">Device:</label>
        <select id="deviceSelect" onchange="changeDevice(this.value)" class="bg-transparent text-neutral-200 font-semibold focus:outline-none cursor-pointer">
          <option value="iphone16pro" class="bg-[#2D1E18]">iPhone 16 Pro (393 × 852)</option>
          <option value="iphone15" selected class="bg-[#2D1E18]">iPhone 15 / 14 (390 × 844)</option>
          <option value="iphonese" class="bg-[#2D1E18]">iPhone SE (375 × 667)</option>
          <option value="pixel8" class="bg-[#2D1E18]">Google Pixel 8 (412 × 915)</option>
          <option value="samsung" class="bg-[#2D1E18]">Samsung S24 (360 × 800)</option>
        </select>
      </div>

      <!-- Destination Switcher -->
      <div class="flex items-center gap-1.5 bg-white/5 border border-white/10 rounded-xl px-2.5 py-1.5">
        <span class="text-neutral-400 text-[11px] font-medium hidden sm:inline">Destination:</span>
        <select id="destSelect" onchange="switchMobileDest(this.value)" class="bg-transparent text-neutral-200 font-semibold focus:outline-none cursor-pointer">
          <option value="mauritius" class="bg-[#2D1E18]">🇲🇺 Mauritius</option>
          <option value="dubai" class="bg-[#2D1E18]">🇦🇪 Dubai</option>
          <option value="paris" class="bg-[#2D1E18]">🇫🇷 Paris</option>
          <option value="switzerland" class="bg-[#2D1E18]">🇨🇭 Switzerland</option>
          <option value="bali" class="bg-[#2D1E18]">🇮🇩 Bali</option>
          <option value="maldives" class="bg-[#2D1E18]">🇲🇻 Maldives</option>
          <option value="thailand" class="bg-[#2D1E18]">🇹🇭 Thailand</option>
          <option value="singapore" class="bg-[#2D1E18]">🇸🇬 Singapore</option>
          <option value="vietnam" class="bg-[#2D1E18]">🇻🇳 Vietnam</option>
          <option value="australia" class="bg-[#2D1E18]">🇦🇺 Australia</option>
        </select>
      </div>

      <!-- Scale Selector -->
      <div class="flex items-center gap-1.5 bg-white/5 border border-white/10 rounded-xl px-2.5 py-1.5">
        <svg class="w-3.5 h-3.5 text-neutral-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v6m3-3H7"/></svg>
        <label for="scaleSelect" class="text-neutral-400 text-[11px] font-medium hidden sm:inline">Scale:</label>
        <select id="scaleSelect" onchange="changeScale(this.value)" class="bg-transparent text-neutral-200 font-semibold focus:outline-none cursor-pointer">
          <option value="1" selected class="bg-[#2D1E18]">100% (Actual)</option>
          <option value="0.9" class="bg-[#2D1E18]">90%</option>
          <option value="0.82" class="bg-[#2D1E18]">82% (Fit Laptop)</option>
          <option value="0.75" class="bg-[#2D1E18]">75%</option>
        </select>
      </div>

      <!-- Rotate Orientation -->
      <button onclick="toggleOrientation()" class="p-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-neutral-300 transition-colors" title="Rotate Orientation">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      </button>

      <!-- Refresh Iframe -->
      <button onclick="reloadFrame()" class="p-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-neutral-300 transition-colors" title="Refresh Live Site">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      </button>

      <!-- Studio Backdrop Switcher -->
      <button onclick="toggleStudioTheme()" id="themeBtn" class="p-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-neutral-300 transition-colors" title="Toggle Light/Dark Studio Backdrop">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
      </button>

      <!-- Launch Standalone Window Button -->
      <button onclick="openMobilePopup()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-gradient-to-r from-[#E05A47] to-[#F59E0B] text-white font-bold hover:brightness-110 shadow-sm transition-all cursor-pointer" title="Open in separate mobile-sized desktop window">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
        <span>Open as App Window</span>
      </button>

    </div>
  </header>

  <!-- Main Simulator Stage -->
  <main class="flex-1 flex flex-col items-center justify-center p-4 sm:p-8 relative">
    
    <!-- Phone Chassis Frame -->
    <div id="phoneWrapper" class="transition-transform duration-300 ease-out origin-top flex items-center justify-center my-auto">
      <div id="phoneChassis" class="titanium-frame relative select-none">
        
        <!-- Hardware buttons -->
        <div class="btn-silent"></div>
        <div class="btn-vol-up"></div>
        <div class="btn-vol-down"></div>
        <div class="btn-power"></div>

        <!-- Phone Screen -->
        <div id="screenContainer" class="screenContainer screen-container relative flex flex-col bg-[#1C120C]">
          
          <!-- iOS Status Bar & Safe Area -->
          <div class="h-11 w-full px-7 flex items-center justify-between text-white text-[12px] font-semibold tracking-tight shrink-0 bg-[#1C120C] select-none z-40 relative">
            <span id="liveClock" class="font-bold text-white">9:41</span>
            
            <!-- Dynamic Island -->
            <div class="dynamic-island">
              <div class="w-2.5 h-2.5 rounded-full bg-[#111] border border-neutral-800"></div>
              <div class="w-2 h-2 rounded-full bg-[#0a1829] border border-blue-900/60"></div>
            </div>

            <!-- Right Status Icons (Cellular, WiFi, Battery) -->
            <div class="flex items-center gap-1.5 text-white/90">
              <!-- Cellular Signal (4 bars) -->
              <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
                <path d="M2 17h3v4H2v-4zm5-4h3v8H7v-8zm5-5h3v13h-3V8zm5-5h3v18h-3V3z"/>
              </svg>
              <!-- 5G Badge -->
              <span class="text-[10px] font-black tracking-tighter text-white/80">5G</span>
              <!-- Battery (100%) -->
              <div class="flex items-center gap-0.5">
                <div class="w-5 h-2.5 rounded-sm border border-white/80 p-0.5 flex items-center">
                  <div class="w-full h-full bg-white rounded-xs"></div>
                </div>
                <div class="w-0.5 h-1 bg-white/80 rounded-r-xs"></div>
              </div>
            </div>
          </div>

          <!-- Embedded Website iFrame Container -->
          <div class="flex-1 w-full relative overflow-hidden">
            <iframe 
              id="mobileIframe" 
              src="mobile.html" 
              class="w-full h-full border-0 bg-[#2D1E18] block"
              title="PassPrivé Travel Mobile View">
            </iframe>
          </div>

          <!-- Home Indicator Safe Area -->
          <div class="h-5 w-full shrink-0 bg-[#2D1E18] flex items-center justify-center relative z-40">
            <div class="w-32 h-1 bg-white/40 rounded-full"></div>
          </div>

        </div>
      </div>
    </div>

    <!-- Quick Jump & Actions Sub-bar -->
    <div class="mt-6 flex flex-wrap items-center justify-center gap-2 text-xs text-neutral-400">
      <span class="font-semibold text-neutral-300">Quick Actions:</span>
      <button onclick="jumpTo('#navbar')" class="px-2.5 py-1 rounded-lg bg-white/5 hover:bg-white/10 hover:text-white transition-colors cursor-pointer">Hero</button>
      <button onclick="jumpTo('#packages-section')" class="px-2.5 py-1 rounded-lg bg-white/5 hover:bg-white/10 hover:text-white transition-colors cursor-pointer">Packages</button>
      <button onclick="triggerIframeAction('openBlogModal')" class="px-2.5 py-1 rounded-lg bg-orange-500/20 text-orange-300 border border-orange-400/30 hover:bg-orange-500/30 transition-colors font-bold cursor-pointer">📰 Travel Journal</button>
      <button onclick="triggerIframeAction('openWriterStudio')" class="px-2.5 py-1 rounded-lg bg-amber-500/20 text-amber-300 border border-amber-400/30 hover:bg-amber-500/30 transition-colors font-bold cursor-pointer">✍️ Writer Studio</button>
      <button onclick="triggerIframeAction('openAuthModal', 'guest')" class="px-2.5 py-1 rounded-lg bg-white/5 hover:bg-white/10 hover:text-white transition-colors cursor-pointer">Guest Tracker</button>
      <button onclick="jumpTo('#faq-section')" class="px-2.5 py-1 rounded-lg bg-white/5 hover:bg-white/10 hover:text-white transition-colors cursor-pointer">FAQ</button>
    </div>

  </main>

  <footer class="w-full py-3 text-center text-[11px] text-neutral-500 border-t border-white/5">
    PassPrivé Travel • Mobile Viewport Simulator • Pixel-accurate iPhone 14/15/16 Pro container
  </footer>

  <script>
    const DEVICES = {
      iphone16pro: { width: 393, height: 852, radius: '44px', chassisRadius: '54px' },
      iphone15:    { width: 390, height: 844, radius: '42px', chassisRadius: '52px' },
      iphonese:    { width: 375, height: 667, radius: '32px', chassisRadius: '42px' },
      pixel8:      { width: 412, height: 915, radius: '38px', chassisRadius: '48px' },
      samsung:     { width: 360, height: 800, radius: '36px', chassisRadius: '46px' }
    };

    let currentDevice = 'iphone15';
    let isLandscape = false;
    let currentScale = 1;
    let isLightStudio = false;

    // Clock
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      let minutes = now.getMinutes();
      minutes = minutes < 10 ? '0' + minutes : minutes;
      const clockEl = document.getElementById('liveClock');
      if (clockEl) clockEl.textContent = `${hours}:${minutes}`;
    }
    updateClock();
    setInterval(updateClock, 10000);

    // Change Device
    function changeDevice(devKey) {
      currentDevice = devKey;
      applyDimensions();
    }

    // Apply Dimensions
    function applyDimensions() {
      const dev = DEVICES[currentDevice] || DEVICES.iphone15;
      const iframe = document.getElementById('mobileIframe');
      const screen = document.getElementById('screenContainer');
      const chassis = document.getElementById('phoneChassis');

      let w = isLandscape ? dev.height : dev.width;
      let h = isLandscape ? dev.width : dev.height;

      iframe.style.width = '100%';
      iframe.style.height = '100%';
      screen.style.width = `${w}px`;
      screen.style.height = `${h}px`;
      screen.style.borderRadius = dev.radius;
      chassis.style.borderRadius = dev.chassisRadius;

      // Hide or show dynamic island in landscape
      const island = document.querySelector('.dynamic-island');
      if (island) island.style.display = isLandscape ? 'none' : 'flex';
    }

    // Scale
    function changeScale(scaleVal) {
      currentScale = parseFloat(scaleVal);
      const wrapper = document.getElementById('phoneWrapper');
      wrapper.style.transform = `scale(${currentScale})`;
    }

    // Auto-fit scale on load if screen is smaller
    function autoScaleForScreen() {
      const availableHeight = window.innerHeight - 180;
      const targetHeight = DEVICES[currentDevice].height + 30;
      if (availableHeight < targetHeight) {
        const ratio = Math.max(0.65, Math.min(1, availableHeight / targetHeight));
        const scaleSelect = document.getElementById('scaleSelect');
        if (ratio < 0.85) {
          scaleSelect.value = "0.82";
          changeScale(0.82);
        }
      }
    }
    window.addEventListener('resize', autoScaleForScreen);
    autoScaleForScreen();

    // Toggle Orientation
    function toggleOrientation() {
      isLandscape = !isLandscape;
      applyDimensions();
    }

    // Reload Frame
    function reloadFrame() {
      const iframe = document.getElementById('mobileIframe');
      iframe.src = iframe.src;
    }

    // Toggle Studio Theme
    function toggleStudioTheme() {
      isLightStudio = !isLightStudio;
      const body = document.getElementById('previewBody');
      if (isLightStudio) {
        body.className = 'bg-[#F2ECE4] text-neutral-900 min-h-screen flex flex-col transition-colors duration-300';
      } else {
        body.className = 'bg-[#15110E] text-neutral-100 min-h-screen flex flex-col transition-colors duration-300';
      }
    }

    // Open dedicated mobile-sized popup window
    function openMobilePopup() {
      const dev = DEVICES[currentDevice] || DEVICES.iphone15;
      const left = Math.max(0, (window.screen.width - dev.width) / 2);
      const top = Math.max(0, (window.screen.height - dev.height) / 2);
      window.open(
        'index.html',
        'PassPriveMobile',
        `width=${dev.width},height=${dev.height},left=${left},top=${top},resizable=yes,scrollbars=yes,status=no,toolbar=no`
      );
    }

    // Quick Jump into iframe hash
    function jumpTo(hash) {
      const iframe = document.getElementById('mobileIframe');
      try {
        iframe.contentWindow.location.hash = hash;
      } catch (e) {
        iframe.src = 'index.html' + hash;
      }
    }

    // Switch Destination in embedded iframe
    function switchMobileDest(destId) {
      const iframe = document.getElementById('mobileIframe');
      try {
        if (iframe.contentWindow && typeof iframe.contentWindow.switchDestination === 'function') {
          iframe.contentWindow.switchDestination(destId);
        }
      } catch (e) {
        console.error('Error switching dest in iframe:', e);
      }
    }

    // Trigger in-website modal actions in iframe
    function triggerIframeAction(fnName, arg) {
      const iframe = document.getElementById('mobileIframe');
      try {
        if (iframe.contentWindow && typeof iframe.contentWindow[fnName] === 'function') {
          iframe.contentWindow[fnName](arg);
        }
      } catch (e) {
        console.error('Error triggering action in iframe:', e);
      }
    }

    applyDimensions();
  </script>
</body>
</html>
